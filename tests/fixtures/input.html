<!doctype html><html><body style="margin:0"><input id="nickname" style="position:relative;z-index:1"><div id="surface" style="position:absolute;left:0;top:0;width:800px;height:600px;background:#eee;touch-action:none"></div><script type="module">
import {InputAdapter} from '/src/client/input.ts';
